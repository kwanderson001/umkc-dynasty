    developmentTrait: "normal",
    xpCurrent: 0, xpToNext: 100,

    depthPosition: p.pos,

    redshirtEligible: p.year === "FR",

}

// ── Player utility functions ───────────────────────────────────────────────
function v71GetPlayerById(id) { return (window.state?.players || V71_FOUNDING_ROSTER).find(p => p.id === id); }
function v71GetPlayersByPos(pos) { return (window.state?.players || V71_FOUNDING_ROSTER).filter(p => p.pos === pos); }
function v71GetStarters() { return (window.state?.players || V71_FOUNDING_ROSTER).filter(p => p.depthRank === 1); }
function v71CalcTeamOVR() {
  const starters = v71GetStarters();
  if (!starters.length) return 0;
  return Math.round(starters.reduce((s,p) => s + p.overall, 0) / starters.length);
}

// ── NIL Engine Functions ──────────────────────────────────────────────────
const V71_NIL_ENGINE = {

  getTotalBudget(state) {
    return (state.nil.donors || []).reduce((sum, d) => sum + (d.annualGift || 0), 0);
  },

  getPlayerNILValue(state, playerId) {
    const deal = (state.nil.deals || []).find(d => d.playerId === playerId && d.status === 'active');
    return deal ? deal.annualValue : 0;
  },

  getDealsByTier(state, tier) {
    return (state.nil.deals || []).filter(d => d.tier === tier && d.status === 'active');
  },

  calcNILSpend(state) {
    return (state.nil.deals || [])
      .filter(d => d.status === 'active')
      .reduce((sum, d) => sum + d.annualValue, 0);
  },

  getTierLabel(value) {
    if (value >= 75000) return 'platinum';
    if (value >= 35000) return 'gold';
    if (value >= 15000) return 'silver';
    if (value >= 5000)  return 'bronze';
    return 'none';
  },

  // NIL effect on player transfer risk
  nilTransferRiskReduction(state, playerId) {
    const val = this.getPlayerNILValue(state, playerId);
    if (val >= 20000) return -15;
    if (val >= 10000) return -10;
    if (val >= 5000)  return -5;
    return 0;
  },

  // NIL effect on recruiting pitch bonus
  nilRecruitingBonus(state) {
    const total = this.calcNILSpend(state);
    if (total >= 100000) return 12;
    if (total >= 60000)  return 8;
    if (total >= 30000)  return 4;
    return 1;
  },

  // Roo 816 Collective reporting summary
  collectiveSummary(state) {
    const totalDonors = (state.nil.donors || []).length;
    const totalPledged = this.getTotalBudget(state);
    const spent = this.calcNILSpend(state);
    const remaining = totalPledged - spent;
    const deals = (state.nil.deals || []).filter(d => d.status === 'active');
    return { totalDonors, totalPledged, spent, remaining, activeDeals: deals.length };
  },

  renderCollectivePanel(state) {
    const s = this.collectiveSummary(state);
    return `
      <div class="roo-card roo-card--gold">
        <h3 class="font-display text-gold" style="font-size:1.3rem;margin-bottom:1rem;">💰 Roo 816 NIL Collective</h3>
        <div class="stat-grid">
          <div class="stat-box"><div class="stat-box__val">$${(s.totalPledged/1000).toFixed(0)}K</div><div class="stat-box__lbl">Total Pledged</div></div>
          <div class="stat-box"><div class="stat-box__val">$${(s.spent/1000).toFixed(0)}K</div><div class="stat-box__lbl">Deployed</div></div>
          <div class="stat-box"><div class="stat-box__val">$${(s.remaining/1000).toFixed(0)}K</div><div class="stat-box__lbl">Available</div></div>
          <div class="stat-box"><div class="stat-box__val">${s.activeDeals}</div><div class="stat-box__lbl">Active Deals</div></div>
          <div class="stat-box"><div class="stat-box__val">${s.totalDonors}</div><div class="stat-box__lbl">Donors</div></div>
        </div>
        <div class="roo-progress" style="margin-top:1rem;">
          <div class="roo-progress__fill" style="width:${Math.min(100,(s.spent/s.totalPledged)*100).toFixed(1)}%"></div>
        </div>
        <p class="text-muted" style="font-size:.75rem;margin-top:.5rem;">
          Budget utilization: ${((s.spent/s.totalPledged)*100).toFixed(1)}%
        </p>
      </div>`;
  }
};

/* ── Run a single Training Camp drill session ────────────────────────────── */
function tcRunDrill(state, drillId, targetPlayerIds) {
  const drill = TC.DRILL_CATALOG.find(d => d.id === drillId);
  if (!drill) return { error: `Unknown drill: ${drillId}` };

  const results = [];
  const log = [];

  targetPlayerIds.forEach(pid => {
    const player = state.players.find(p => p.id === pid);
    if (!player) return;

    // XP gain with coaching bonus
    const coachBonus = tcGetCoachBonus(state, drill.unit);
    const xpEarned = Math.round(drill.xpGain * (1 + coachBonus / 100));
    player.xpCurrent = (player.xpCurrent || 0) + xpEarned;

    // Stat micro-gain
    const statGain = Math.random() < 0.3 ? 1 : 0;
    if (drill.statKey && drill.statKey !== 'overall' && drill.statKey !== 'leadership') {
      player[drill.statKey] = Math.min(99, (player[drill.statKey] || 50) + statGain);
    }

    // Camp grade update
    const rawPerf = 60 + Math.floor(Math.random() * 40);
    const perfMod = rawPerf + (player.overall - 60) * 0.4;
    const cappedPerf = Math.min(99, Math.max(30, perfMod));
    if (!player.campGrade) player.campGrade = { score: 70, drillCount: 0, raw: [] };
    player.campGrade.raw.push(cappedPerf);
    player.campGrade.drillCount++;
    player.campGrade.score = Math.round(
      player.campGrade.raw.reduce((a,b) => a+b, 0) / player.campGrade.raw.length
    );
    if (!player.campDrillScores) player.campDrillScores = {};
    player.campDrillScores[drillId] = cappedPerf;

    // Injury check
    let injured = false;
    const injRoll = Math.random() * 100;
    const injThresh = drill.injuryRisk * (1 - (state.staff.find(s=>s.campRole==='team_physician')?.xpBonus?.campFitness||0)/200);
    if (injRoll < injThresh && player.injuryStatus === 'healthy') {
      const injType = TC.INJURY_TYPES[Math.floor(Math.random() * (TC.INJURY_TYPES.length - 1))];
      const weeks = injType.weeksOut[0] + Math.floor(Math.random() * (injType.weeksOut[1] - injType.weeksOut[0] + 1));
      player.injuryStatus = 'injured';
      player.injuryWeeksRemaining = weeks;
      player.injuryType = injType.name;
      state.trainingCamp.injuries.push({ playerId: pid, name: player.name, injury: injType.name, weeksOut: weeks });
      injured = true;
    }

    // Fatigue
    state.trainingCamp.physicalCondition = Math.max(40,
      (state.trainingCamp.physicalCondition || 85) - (drill.fatigueHit * 0.15));

    results.push({ pid, name: player.name, xpEarned, perfScore: Math.round(cappedPerf), injured });
    log.push(`${player.name} – Drill: ${drill.name} | Perf: ${Math.round(cappedPerf)} | XP: +${xpEarned}${injured ? ' ⚠️ INJURED' : ''}`);
  });

  state.trainingCamp.drillsCompleted.push({ drillId, drill: drill.name, results });

  return { drill: drill.name, results, log };
}

/* ── Get coaching XP bonus for a unit ──────────────────────────────────────*/
function tcGetCoachBonus(state, unit) {
  const unitMap = { PASS:['off_coordinator','qb_coach','wr_coach'],
                    QB:['qb_coach'], WR:['wr_coach'], OL:['ol_coach'],
                    RB:['rb_coach'], TE:['te_coach'], DL:['dl_coach'],
                    LB:['lb_coach'], DB:['cb_coach','safety_coach'],
                    ST:['st_coordinator'], ALL:['overall_director'],
                    CAPT:['player_dev'], OFF:['off_coordinator'], DEF:['def_coordinator'] };
  const roles = unitMap[unit] || [];
  let bonus = 0;
  roles.forEach(role => {
    const coach = state.staff.find(s => s.campRole === role);
    if (coach) bonus += (coach.overallRating - 60) * 0.2;
  });
  return Math.max(0, bonus);
}

/* ── Advance Training Camp week ─────────────────────────────────────────────*/
function tcAdvanceWeek(state) {
  if (state.trainingCamp.week >= TC.WEEKS - 1) {
    state.currentPhase = 'REGULAR';
    state.currentWeek  = 1;
    tcLockDepthChart(state);
    V71_BROADCAST_ENGINE.addEntry(state, 'TC_COMPLETE',
      `Training Camp concludes. ${tcGetTopPerformer(state)} earns camp MVP honors as UMKC prepares for Week 1.`);
    return { action: 'CAMP_COMPLETE', week: state.trainingCamp.week };
  }
  state.trainingCamp.week++;
  // Pads on at Week 1
  if (state.trainingCamp.week === 1) state.trainingCamp.padsOn = true;
  // Fatigue recovery on week advance
  state.trainingCamp.physicalCondition = Math.min(100, state.trainingCamp.physicalCondition + 12);
  return { action: 'WEEK_ADVANCED', week: state.trainingCamp.week };
}

/* ── Lock depth chart based on camp grades ──────────────────────────────────*/
function tcLockDepthChart(state) {
  const byPos = {};
  state.players.forEach(p => {
    if (!byPos[p.pos]) byPos[p.pos] = [];
    byPos[p.pos].push(p);
  });
  Object.keys(byPos).forEach(pos => {
    byPos[pos].sort((a,b) => {
      const ga = a.campGrade?.score || a.overall;
      const gb = b.campGrade?.score || b.overall;
      return gb - ga;
    });
    byPos[pos].forEach((p, i) => { p.depthRank = i + 1; });
  });
  state.trainingCamp.depthChartLocked = true;
}

/* ── Top camp performer ─────────────────────────────────────────────────────*/
function tcGetTopPerformer(state) {
  const scored = state.players.filter(p => p.campGrade?.score);
  if (!scored.length) return "Unknown";
  return scored.sort((a,b) => b.campGrade.score - a.campGrade.score)[0].name;
}

/* ── UI shim functions (wire to your state manager) ─────────────────────── */
function tcRunDrillUI(drillId) {
  if (!window.state) return;
  const drill = TC.DRILL_CATALOG.find(d => d.id === drillId);
  if (!drill) return;
  // Target all healthy players in the drill's unit or all
  let targets = window.state.players.filter(p => p.injuryStatus === 'healthy');
  if (drill.unit !== 'ALL' && drill.unit !== 'CAPT') {
    const unitPos = { PASS:['QB','WR','TE'], QB:['QB'], WR:['WR'], RB:['RB'], TE:['TE'],
                      OL:['OL'], DL:['DE','DT'], LB:['LB'], DB:['CB','SS','FS'],
                      OFF:['QB','WR','RB','TE','OL'], DEF:['DE','DT','LB','CB','SS','FS'],
                      ST:['K','P','LS'] };
    const pos = unitPos[drill.unit] || [];
    targets = targets.filter(p => pos.includes(p.pos));
  }
  if (drill.unit === 'CAPT') targets = targets.filter(p => p.personalityTrait === 'captain');
  const result = tcRunDrill(window.state, drillId, targets.map(p=>p.id));
  v71SaveState(window.state);
  document.getElementById('main-content').innerHTML = renderTrainingCamp(window.state);
  V71_BROADCAST_ENGINE.addEntry(window.state, 'DRILL',
    `${drill.name} completed. ${result.results.length} players participated.` +
    (result.results.some(r=>r.injured) ? ` ⚠️ ${result.results.filter(r=>r.injured).map(r=>r.name).join(', ')} left with injuries.` : ''));
}

function v71AdvanceCampWeek() {
  if (!window.state) return;
  const res = tcAdvanceWeek(window.state);
  v71SaveState(window.state);
  if (res.action === 'CAMP_COMPLETE') {
    document.getElementById('main-content').innerHTML = renderTrainingCamp(window.state);
  } else {
    document.getElementById('main-content').innerHTML = renderTrainingCamp(window.state);
  }
}

function v71StartRegularSeason() {
  if (!window.state) return;
  window.state.currentPhase = 'REGULAR';
  window.state.currentWeek  = 1;
  window.state.seasonStarted = true;
  v71SaveState(window.state);
  renderCurrentView(window.state);
}

/* ── Recruiting Engine ───────────────────────────────────────────────────── */
const V71_RECRUITING_ENGINE = {

  /* Points income per week */
  weeklyPoints(state) {
    const staffBonus = (state.staff.find(s => s.campRole === 'recruiting_dir')?.xpBonus?.recPoints || 0);
    const winBonus   = Math.min(10, (state.metrics.wins || 0) * 1.5);
    const presBonus  = Math.floor((state.metrics.prestige - 20) * 0.2);
    const nilBonus   = V71_NIL_ENGINE.nilRecruitingBonus(state);
    return REC.BASE_POINTS_PER_WEEK + staffBonus + winBonus + presBonus + nilBonus;
  },

  /* Spend points on an action */
  spendPoints(state, cost, action) {
    if ((state.recruiting.pointsBank || 0) < cost) return { ok: false, msg: `Need ${cost} pts (have ${state.recruiting.pointsBank})` };
    state.recruiting.pointsBank -= cost;
    state.recruiting.pointsBank = Math.round(state.recruiting.pointsBank * 10) / 10;
    return { ok: true };
  },

  /* Add a recruit to the board */
  addToBoard(state, recruit) {
    if ((state.recruiting.currentBoard || []).length >= REC.BOARD_LIMIT)
      return { ok:false, msg:"Board full (30 max)" };
    state.recruiting.currentBoard.push(recruit);
    return { ok:true };
  },

  /* Send offer */
  sendOffer(state, recruitId) {
    const result = this.spendPoints(state, REC.OFFER_COST, 'OFFER');
    if (!result.ok) return result;
    const rec = state.recruiting.currentBoard.find(r => r.id === recruitId);
    if (!rec) return { ok:false, msg:"Recruit not on board" };
    rec.offered = true;
    rec.interest = Math.min(100, rec.interest + 12);
    rec.interactions.push({ type:'offer', week: state.currentWeek, interestChange:+12 });
    return { ok:true, msg:`Offer extended to ${rec.name}` };
  },

  /* Schedule official visit */
  scheduleVisit(state, recruitId, type='official') {
    const cost = type === 'official' ? REC.VISIT_OFFICIAL_COST : REC.VISIT_UNOFFICIAL_COST;
    const result = this.spendPoints(state, cost, 'VISIT');
    if (!result.ok) return result;
    const rec = state.recruiting.currentBoard.find(r => r.id === recruitId);
    if (!rec) return { ok:false, msg:"Recruit not on board" };
    const nilBonus = V71_NIL_ENGINE.nilRecruitingBonus(state);
    const visitGain = type === 'official' ? 18 + nilBonus : 10 + Math.floor(nilBonus/2);
    rec.interest = Math.min(100, rec.interest + visitGain);
    rec.visited  = true;
    rec.interactions.push({ type:`visit_${type}`, week: state.currentWeek, interestChange: visitGain });
    return { ok:true, msg:`${type==='official'?'Official':'Unofficial'} visit scheduled for ${rec.name} (+${visitGain} interest)` };
  },

  /* Make a phone call */
  callRecruit(state, recruitId) {
    const result = this.spendPoints(state, REC.CALL_COST, 'CALL');
    if (!result.ok) return result;
    const rec = state.recruiting.currentBoard.find(r => r.id === recruitId);
    if (!rec) return { ok:false, msg:"Recruit not on board" };
    const coachBonus = state.staff.find(s=>s.campRole==='recruiting_dir')?.overallRating > 70 ? 3 : 1;
    const gain = 4 + coachBonus;
    rec.interest = Math.min(100, rec.interest + gain);
    rec.interactions.push({ type:'call', week: state.currentWeek, interestChange: gain });
    return { ok:true, msg:`Called ${rec.name} (+${gain} interest)` };
  },

  /* Pitch a category */
  pitchCategory(state, recruitId, category) {
    if (!REC.PITCH_CATEGORIES.includes(category)) return { ok:false, msg:"Invalid pitch category" };
    const result = this.spendPoints(state, 2, 'PITCH');
    if (!result.ok) return result;
    const rec = state.recruiting.currentBoard.find(r => r.id === recruitId);
    if (!rec) return { ok:false, msg:"Not on board" };
    const weight = (rec.pitchWeight || {})[category.replace(/[/ ]/g,'')] || 10;
    const eff = Math.round(weight * (0.8 + Math.random() * 0.4));
    rec.interest = Math.min(100, rec.interest + Math.floor(eff * 0.4));
    if (!rec.pitchScores) rec.pitchScores = {};
    rec.pitchScores[category] = (rec.pitchScores[category] || 0) + eff;
    rec.interactions.push({ type:`pitch_${category}`, week: state.currentWeek, interestChange: Math.floor(eff*.4) });
    return { ok:true, msg:`Pitched "${category}" to ${rec.name} (effectiveness: ${eff})` };
  },

  /* Weekly interest decay / competitor pulls */
  weeklyDecay(state) {
    (state.recruiting.currentBoard || []).forEach(rec => {
      if (rec.committed) return;
      const competitors = (rec.competitors || []).length;
      const decay = Math.max(0, competitors * 2 - (state.metrics.prestige - 20) * 0.15);
      rec.interest = Math.max(0, rec.interest - Math.round(decay));
    });
  },

  /* Advance recruiting week (call each regular season week) */
  weeklyTick(state) {
    const earned = this.weeklyPoints(state);
    state.recruiting.pointsBank = (state.recruiting.pointsBank || 0) + earned;
    this.weeklyDecay(state);
    return earned;
  },

  /* Interest label helper */
  interestLabel(interest) {
    if (interest >= 76) return REC.INTEREST.commit;
    if (interest >= 51) return REC.INTEREST.hot;
    if (interest >= 26) return REC.INTEREST.warm;
    return REC.INTEREST.cold;
  },

  /* Check for commitments */
  checkCommitments(state) {
    const newCommits = [];
    (state.recruiting.currentBoard || []).forEach(rec => {
      if (rec.committed || rec.interest < 80) return;
      const roll = Math.random() * 100;
      if (roll < (rec.interest - 75) * 4) {
        rec.committed = true;
        state.recruiting.commitments.push({ ...rec, commitWeek: state.currentWeek });
        newCommits.push(rec.name);
        state.metrics.prestige = Math.min(100, (state.metrics.prestige || 22) + 2);
        V71_BROADCAST_ENGINE.addEntry(state, 'COMMIT',
          `🎉 ${rec.name} (${rec.stars}⭐ ${rec.pos}) commits to the UMKC Kangaroos! #RooNation`);
      }
    });
    return newCommits;
  },

  /* Render recruiting board UI */
  renderBoard(state) {
    const board = state.recruiting.currentBoard || [];
    const pts   = state.recruiting.pointsBank  || 0;
    const weeklyPts = this.weeklyPoints(state);

    return `

    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;">
      <div>
        <h2 class="font-display text-gold" style="font-size:2rem;">📋 RECRUITING BOARD ${state.currentYear}</h2>
        <p class="text-muted">Director: Rafael Ocampo &nbsp;·&nbsp; ${board.length}/${REC.BOARD_LIMIT} prospects</p>
      </div>
      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);gap:.75rem;min-width:260px;">
        <div class="stat-box"><div class="stat-box__val">${pts.toFixed(0)}</div><div class="stat-box__lbl">Points</div></div>
        <div class="stat-box"><div class="stat-box__val">+${weeklyPts}</div><div class="stat-box__lbl">/week</div></div>
        <div class="stat-box"><div class="stat-box__val">${(state.recruiting.commitments||[]).length}</div><div class="stat-box__lbl">Commits</div></div>
      </div>
    </div>
  </div>

  <div class="roo-card">
    <h3 class="font-display text-gold" style="margin-bottom:1rem;">🎯 Prospect Board</h3>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.85rem;min-width:700px;">
        <thead>
          <tr style="border-bottom:2px solid var(--color-border);">
            ${['Name','Pos','Stars','Hometown','Interest','Status','Actions'].map(h =>
              `<th style="padding:.6rem .75rem;text-align:left;color:var(--color-text-muted);font-size:.75rem;text-transform:uppercase;">${h}</th>`
            ).join('')}
          </tr>
        </thead>
        <tbody>
          ${board.map(rec => {
            const il = this.interestLabel(rec.interest);
            return `<tr style="border-bottom:1px solid var(--color-border);">
              <td style="padding:.6rem .75rem;font-weight:600;">${rec.name}</td>
              <td style="padding:.6rem .75rem;"><span class="roo-badge badge-camp">${rec.pos}</span></td>
              <td style="padding:.6rem .75rem;">${'⭐'.repeat(rec.stars)}</td>
              <td style="padding:.6rem .75rem;color:var(--color-text-muted);">${rec.hometown}</td>
              <td style="padding:.6rem .75rem;">
                <div style="display:flex;align-items:center;gap:.5rem;">
                  <div class="roo-progress" style="width:80px;">
                    <div class="roo-progress__fill" style="width:${rec.interest}%;background:${il.color};"></div>
                  </div>
                  <span style="font-size:.75rem;color:${il.color};font-weight:600;">${il.label}</span>
                </div>
              </td>
              <td style="padding:.6rem .75rem;">
                ${rec.committed ? '<span class="roo-badge" style="background:#10B981;color:white;">COMMITTED</span>'
                  : rec.offered ? '<span class="roo-badge" style="background:#3B82F6;color:white;">Offered</span>'
                  : '<span class="roo-badge badge-star-1">Tracking</span>'}
              </td>
              <td style="padding:.6rem .75rem;">
                ${rec.committed ? '✅' : `
                  <div style="display:flex;gap:.4rem;flex-wrap:wrap;">
                    ${!rec.offered ? `<button class="roo-btn roo-btn--sm roo-btn--ghost" onclick="recOffer('${rec.id}')">Offer(${REC.OFFER_COST})</button>` : ''}
                    <button class="roo-btn roo-btn--sm roo-btn--primary" onclick="recCall('${rec.id}')">Call(${REC.CALL_COST})</button>

          }).join('')}
        </tbody>

    </div>
  </div>

  }

// PATCH SECTION I — GAME DAY SIM v2.1
// ACTION: Paste as-is. Call v71SimGame(state, gameId) to run a game.
// ═══════════════════════════════════════════════════════════════════════════

/* ── GDS v2.1 Constants ─────────────────────────────────────────────────── */
const GDS = {
  QUARTERS:      4,
  PLAYS_PER_QTR: 16,   // avg plays per quarter per team
  SCORE_VALUES:  { TD:6, PAT:1, FG:3, SAFETY:2, XP2:2 },

  // Play type distribution (Mercer-Ball spread read-option)
  PLAY_DIST: {
    offense: [
      { type:'pass_short',   weight:28, yardsRange:[2,12],  turnoverRate:0.04 },
      { type:'pass_medium',  weight:22, yardsRange:[8,22],  turnoverRate:0.06 },
      { type:'pass_deep',    weight:10, yardsRange:[20,55],  turnoverRate:0.10 },
      { type:'run_inside',   weight:20, yardsRange:[-2,8],  turnoverRate:0.02 },
      { type:'run_outside',  weight:12, yardsRange:[0,15],  turnoverRate:0.02 },
      { type:'qb_scramble',  weight:6,  yardsRange:[2,18],  turnoverRate:0.03 },
      { type:'screen',       weight:2,  yardsRange:[3,20],  turnoverRate:0.03 }
    ],
    defense: [
      { type:'zone_cover2',  weight:30, yardsAllowed:[4,14], sackRate:0.04 },
      { type:'man_press',    weight:25, yardsAllowed:[2,22], sackRate:0.03 },
      { type:'blitz_mike',   weight:20, yardsAllowed:[-4,30], sackRate:0.15 },
      { type:'cover3',       weight:15, yardsAllowed:[5,16], sackRate:0.03 },
      { type:'dime',         weight:10, yardsAllowed:[3,20], sackRate:0.02 }
    ]
  },

  // Rating-to-modifier conversion
  ratingMod(rating) { return (rating - 70) * 0.015; },

  // Home field advantage calculation
  hfa(state) {
    const section = (state.stadium?.sections || []);
    const fans = section.reduce((s,sec) => s + sec.capacity * sec.fillRate, 0);
    const cap  = section.reduce((s,sec) => s + sec.capacity, 0);
    const fill = cap > 0 ? fans/cap : 0.4;
    const base = state.stadium?.hfaBase || 6;
    const max  = state.stadium?.hfaMaxWithFull || 14;
    return base + (max - base) * fill;
  }
};

/* ── Drive Simulator ─────────────────────────────────────────────────────── */
function gdsSimDrive(offTeam, defTeam, fieldPos, state, isHome) {
  let down = 1, toGo = 10, yard = fieldPos;
  const plays = [];
  let turnover = false, score = null;

  for (let p = 0; p < 20; p++) {
    // Pick play type
    const offPlay = GDS.PLAY_DIST.offense[weightedRand(GDS.PLAY_DIST.offense.map(x=>x.weight))];
    const defPlay = GDS.PLAY_DIST.defense[weightedRand(GDS.PLAY_DIST.defense.map(x=>x.weight))];

    // Yards gained
    const offMod = GDS.ratingMod(offTeam.overall) + (isHome ? GDS.hfa(state)*0.04 : 0);
    const defMod = GDS.ratingMod(defTeam.overall);
    const baseGain = offPlay.yardsRange[0] + Math.random() * (offPlay.yardsRange[1] - offPlay.yardsRange[0]);
    const gained   = Math.round(baseGain + offMod * 5 - defMod * 4 + (Math.random()-0.5)*3);
    
    // Turnover check
    const toRate = offPlay.turnoverRate * (1 - offMod * 0.5) * (1 + defMod * 0.5);
    if (Math.random() < toRate) {
      plays.push({ type: offPlay.type, down, toGo, yards: 0, result: 'TURNOVER' });
      turnover = true;
      break;
    }

    // Sack check
    const sackRate = defPlay.sackRate * (1 + defMod * 0.3);
    if (offPlay.type.startsWith('pass') && Math.random() < sackRate) {
      yard -= 6; toGo += 6; down++;
      plays.push({ type: 'sack', down, toGo: toGo+6, yards: -6, result: 'SACK' });
      if (down > 4) { turnover = true; break; }
      continue;
    }

    yard += gained;
    toGo -= gained;

    const result = gained >= (offPlay.yardsRange[1]*0.65) ? 'FIRST_DOWN' : gained > 0 ? 'GAIN' : 'LOSS';
    plays.push({ type: offPlay.type, down, toGo, yards: gained, result });

    if (yard >= 100) { score = 'TD'; break; }
    if (toGo <= 0)   { down = 1; toGo = 10; }
    else              { down++; }

    if (down > 4) {
      // Punt or FG attempt
      if (yard >= 65) {
        const fgDist = 100 - yard + 17;
        const fgPct  = Math.max(0.2, 0.92 - (fgDist - 20) * 0.025 + GDS.ratingMod(offTeam.overall)*2);
        if (Math.random() < fgPct) { score = 'FG'; }
        else { score = 'FG_MISS'; }
      } else {
        score = 'PUNT';
      }
      break;
    }
  }
  return { plays, turnover, score, finalYard: yard };
}

/* ── Weighted random index ───────────────────────────────────────────────── */
function weightedRand(weights) {
  const total = weights.reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for (let i=0; i<weights.length; i++) { r -= weights[i]; if (r <= 0) return i; }
  return weights.length-1;
}

/* ── Build team summary from state ──────────────────────────────────────── */
function gdsBuildTeam(state) {
  const ovr = v71CalcTeamOVR();
  const starters = v71GetStarters();
  return {
    name:    state.program.name,
    overall: ovr,
    off:     Math.round(starters.filter(p=>['QB','WR','RB','TE','OL'].includes(p.pos)).reduce((s,p)=>s+p.overall,0)/Math.max(1,starters.filter(p=>['QB','WR','RB','TE','OL'].includes(p.pos)).length)),
    def:     Math.round(starters.filter(p=>['DE','DT','LB','CB','SS','FS'].includes(p.pos)).reduce((s,p)=>s+p.overall,0)/Math.max(1,starters.filter(p=>['DE','DT','LB','CB','SS','FS'].includes(p.pos)).length))
  };
}

/* ── Main Sim Function ───────────────────────────────────────────────────── */
function v71SimGame(state, gameId) {
  const game = (state.schedule || []).find(g => g.id === gameId);
  if (!game) return { error: `Game ${gameId} not found` };
  if (game.result && game.result !== null && game.result !== 'BYE') return { error: 'Already played' };

  const isHome = game.location === 'HOME';
  const umkcOVR = v71CalcTeamOVR();
  const oppOVR  = game.opponentOverall || 60;
  const hfaBonus = isHome ? GDS.hfa(state) : -3;

  const umkcTeam = { name: state.program.name,   overall: umkcOVR + hfaBonus };
  const oppTeam  = { name: game.opponent,         overall: oppOVR };

  let score = { umkc:0, opp:0 };
  const driveLog = [];
  const boxScore = {
    umkc: { passYds:0, rushYds:0, totalYds:0, turnovers:0, sacks:0, thirdDownConv:0, thirdDownAtt:0, redZoneAtt:0, redZoneTD:0, punts:0 },
    opp:  { passYds:0, rushYds:0, totalYds:0, turnovers:0, sacks:0, thirdDownConv:0, thirdDownAtt:0, redZoneAtt:0, redZoneTD:0, punts:0 }
  };

  // Simulate 4 quarters
  for (let q = 0; q < GDS.QUARTERS; q++) {
    for (let drive = 0; drive < 3; drive++) {
      // UMKC offense
      const umkcStart = 20 + Math.floor(Math.random()*20);
      const uDrive = gdsSimDrive(umkcTeam, oppTeam, umkcStart, state, isHome);
      driveLog.push({ team:'UMKC', qtr:q+1, drive, ...uDrive });
      uDrive.plays.forEach(p => {
        if (p.yards > 0) { p.type.startsWith('pass') ? boxScore.umkc.passYds += p.yards : boxScore.umkc.rushYds += p.yards; }
        boxScore.umkc.totalYds += Math.max(0, p.yards);
      });
      if (uDrive.score === 'TD') {
        score.umkc += 7;
        boxScore.umkc.redZoneAtt++; boxScore.umkc.redZoneTD++;
      } else if (uDrive.score === 'FG') { score.umkc += 3; }
      else if (uDrive.score === 'PUNT') { boxScore.umkc.punts++; }
      if (uDrive.turnover) boxScore.umkc.turnovers++;

      // Opponent offense
      const oppStart = 20 + Math.floor(Math.random()*20);
      const oDrive = gdsSimDrive(oppTeam, umkcTeam, oppStart, state, !isHome);
      driveLog.push({ team:'OPP', qtr:q+1, drive, ...oDrive });
      oDrive.plays.forEach(p => {
        boxScore.opp.totalYds += Math.max(0, p.yards);
        p.yards > 0 && (p.type.startsWith('pass') ? boxScore.opp.passYds += p.yards : boxScore.opp.rushYds += p.yards);
      });
      if (oDrive.score === 'TD') {
        score.opp += 7;
        boxScore.opp.redZoneAtt++; boxScore.opp.redZoneTD++;
      } else if (oDrive.score === 'FG') { score.opp += 3; }
      else if (oDrive.score === 'PUNT') { boxScore.opp.punts++; }
      if (oDrive.turnover) boxScore.opp.turnovers++;
    }
  }

  // Overtime (if tied)
  if (score.umkc === score.opp) {
    const otUmkc = gdsSimDrive(umkcTeam, oppTeam, 25, state, isHome);
    const otOpp  = gdsSimDrive(oppTeam, umkcTeam, 25, state, !isHome);
    if (otUmkc.score === 'TD') score.umkc += 8;
    if (otOpp.score  === 'TD') score.opp  += 8;
    if (score.umkc === score.opp) score.umkc += 3; // UMKC wins coin flip
  }

  const won = score.umkc > score.opp;
  game.result    = won ? 'W' : 'L';
  game.score     = { umkc: score.umkc, opp: score.opp };
  game.stats     = boxScore;
  game.attendance = Math.round((state.stadium?.capacity || 10000) *
    (0.4 + Math.min(0.5, state.metrics.prestige * 0.005 + (isHome?0.1:0))));

  // Update metrics
  if (won) { state.metrics.wins++;   state.metrics.prestige = Math.min(100, state.metrics.prestige + 2); }
  else     { state.metrics.losses++; state.metrics.prestige = Math.max(0,   state.metrics.prestige - 1); }
  state.metrics.pointsScored  += score.umkc;
  state.metrics.pointsAllowed += score.opp;

  // Recruiting boost on wins
  if (won) V71_RECRUITING_ENGINE.weeklyTick(state);

  // Broadcast entry
  V71_BROADCAST_ENGINE.addEntry(state, 'GAME_RESULT',
    `FINAL: UMKC ${score.umkc}, ${game.opponentShort} ${score.opp}. ` +
    `${won ? `Roos pick up the W! ${boxScore.umkc.totalYds} total yards.` 
           : `Roos fall ${score.opp}-${score.umkc}. ${boxScore.umkc.turnovers} turnovers hurt.`}`);

  // Culture morale
  state.culture.cohesion = Math.min(100, Math.max(0, state.culture.cohesion + (won ? 4 : -3)));

  return { result: game.result, score, boxScore, driveLog, game };
}

  return `
<div style="padding:1.5rem;">

      </p>

          <div class="font-display" style="font-size:1.5rem;color:var(--umkc-gold);">UMKC</div>
          <div class="font-display" style="font-size:3.5rem;font-weight:700;">${played ? game.score.umkc : '--'}</div>
          <div style="font-size:.75rem;color:var(--color-text-muted);">(${rec.w}-${rec.l})</div>
        </div>
        <div style="font-size:2rem;color:var(--color-text-muted);">VS</div>
        <div style="text-align:center;">
          <div class="font-display" style="font-size:1.5rem;">${game.opponentShort}</div>
          <div class="font-display" style="font-size:3.5rem;font-weight:700;">${played ? game.score.opp : '--'}</div>
          <div style="font-size:.75rem;color:var(--color-text-muted);">${game.opponentConference || ''}</div>
        </div>
      </div>
      ${played ? `<span class="roo-badge" style="background:${game.result==='W'?'var(--roo-success)':'var(--roo-danger)'};color:white;font-size:1rem;padding:.5rem 1.5rem;">${game.result==='W'?'VICTORY':'DEFEAT'}</span>` : ''}
      <p style="margin-top:.5rem;font-size:.85rem;color:var(--color-text-muted);">
        ${game.televised ? `📺 ${game.broadcast}` : ''} &nbsp; ⏰ ${game.kickoff || 'TBD'}
        ${game.isRivalry ? ` &nbsp; 🔥 ${game.isRivalryName}` : ''}
      </p>
    </div>
  </div>

  ${played ? `
  <!-- Box Score -->
  <div class="roo-card" style="margin-bottom:1.5rem;">
    <h3 class="font-display text-gold" style="margin-bottom:1rem;">📊 Box Score</h3>
    <table style="width:100%;border-collapse:collapse;font-size:.875rem;">
      <thead>
        <tr style="border-bottom:2px solid var(--color-border);">
          <th style="padding:.6rem;text-align:left;color:var(--color-text-muted);">Stat</th>
          <th style="padding:.6rem;text-align:center;color:var(--umkc-gold);">UMKC</th>
          <th style="padding:.6rem;text-align:center;color:var(--color-text-muted);">${game.opponentShort}</th>
        </tr>
      </thead>
      <tbody>
        ${[['Total Yards','totalYds'],['Pass Yards','passYds'],['Rush Yards','rushYds'],
           ['Turnovers','turnovers'],['Punts','punts'],['Red Zone TD','redZoneTD']].map(([lbl,key]) => `
          <tr style="border-bottom:1px solid var(--color-border);">
            <td style="padding:.5rem;color:var(--color-text-muted);">${lbl}</td>
            <td style="padding:.5rem;text-align:center;font-weight:600;color:var(--umkc-gold);">${game.stats?.umkc?.[key] ?? 0}</td>
            <td style="padding:.5rem;text-align:center;">${game.stats?.opp?.[key] ?? 0}</td>
          </tr>`).join('')}
        <tr style="border-bottom:1px solid var(--color-border);">
          <td style="padding:.5rem;color:var(--color-text-muted);">Attendance</td>
          <td colspan="2" style="padding:.5rem;text-align:center;">${(game.attendance||0).toLocaleString()}</td>
        </tr>
      </tbody>
    </table>
  </div>` : `
  <!-- Pre-game buttons -->
  <div style="display:flex;gap:1rem;flex-wrap:wrap;">
    <button class="roo-btn roo-btn--gold" onclick="v71SimAndShow('${game.id}')">🏈 Simulate Game</button>
    <button class="roo-btn roo-btn--primary" onclick="renderSchedule(window.state)">← Back to Schedule</button>
  </div>`}

  ${played ? `<div style="display:flex;gap:1rem;margin-top:1rem;">
    <button class="roo-btn roo-btn--primary" onclick="renderSchedule(window.state)">← Back to Schedule</button>
    <button class="roo-btn roo-btn--ghost" onclick="renderBroadcast(window.state)">📻 Broadcast Log</button>
  </div>` : ''}
</div>`;
}

function v71SimAndShow(gameId) {
  if (!window.state) return;
  const result = v71SimGame(window.state, gameId);
  window.state.currentWeek = Math.min(13, window.state.currentWeek + 1);
  V71_RECRUITING_ENGINE.weeklyTick(window.state);
  V71_RECRUITING_ENGINE.checkCommitments(window.state);
  v71SaveState(window.state);
  document.getElementById('main-content').innerHTML = renderGameDay(window.state, gameId);
}

/* ── Broadcast Engine Object ─────────────────────────────────────────────── */
const V71_BROADCAST_ENGINE = {

  // Add an entry to the broadcast log
  addEntry(state, type, text, meta={}) {
    if (!state.broadcast) state.broadcast = { broadcastLog: [] };
    if (!state.broadcast.broadcastLog) state.broadcast.broadcastLog = [];
    state.broadcast.broadcastLog.unshift({
      id:     `bc_${Date.now()}_${Math.random().toString(36).slice(2,6)}`,
      type,
      text,
      meta,
      week:   state.currentWeek,
      year:   state.currentYear,
      phase:  state.currentPhase,
      ts:     new Date().toISOString()
    });
    // Cap log at 200 entries
    if (state.broadcast.broadcastLog.length > 200)
      state.broadcast.broadcastLog = state.broadcast.broadcastLog.slice(0, 200);
  },

  // Generate a TD call
  tdCall(playerName, yards) {
    const t = BCAST.TD_CALLS[Math.floor(Math.random() * BCAST.TD_CALLS.length)];
    return t(playerName, yards);
  },

  // Generate a turnover call
  turnoverCall(playerName) {
    const t = BCAST.TURNOVER_CALLS[Math.floor(Math.random() * BCAST.TURNOVER_CALLS.length)];
    return t(playerName);
  },

  // Generate a commitment splash
  commitSplash(name, stars, pos) {
    const t = BCAST.COMMIT_LINES[Math.floor(Math.random() * BCAST.COMMIT_LINES.length)];
    return t(name, stars, pos);
  },

  // Generate post-game narrative
  postgameNarrative(state, game) {
    const won = game.result === 'W';
    const lines = won ? BCAST.WIN_LINES : BCAST.LOSS_LINES;
    const main  = lines[Math.floor(Math.random() * lines.length)];
    const stats = game.stats?.umkc;
    const flavor = BCAST.DRILL_FLAVOR[Math.floor(Math.random() * BCAST.DRILL_FLAVOR.length)];

    const rivalryHype = game.isRivalry && BCAST.RIVALRY_HYPE[game.isRivalryName]
      ? BCAST.RIVALRY_HYPE[game.isRivalryName][Math.floor(Math.random()*2)]
      : null;

    return {
      headline:  `FINAL: UMKC ${game.score?.umkc ?? 0} – ${game.opponentShort} ${game.score?.opp ?? 0}`,
      pbpLine:   main,
      colorLine: `Coach Rollins: "${won ? 'Elite preparation. Jake Mercer had them ready.' : 'We\'ll correct it on film. Roos don\'t quit.'}"`,
      sidelineReport: `Avila: "${stats ? `${stats.totalYds} total yards — ${stats.turnovers} turnovers.` : 'Full report coming.'}"`,
      rivalryHype,
      statBlurb: stats ? `UMKC: ${stats.passYds} pass yds | ${stats.rushYds} rush yds | ${stats.turnovers} TO` : ''
    };
  },

  // Generate season narrative summary
  seasonNarrative(state) {
    const rec = v71GetRecord(state.schedule || []);
    const prestige = state.metrics.prestige || 22;
    const commits  = (state.recruiting.commitments||[]).length;

    const tone = rec.w >= rec.l ? 'positive' : 'concern';
    const lines = {
      positive: [
        `Through ${rec.w+rec.l} games, UMKC stands at ${rec.w}-${rec.l}. Kansas City is believing.`,
        `Webb: "The Roos are for real. ${rec.w} wins in Year One — write it down."`,
        `Prestige rising (${prestige}/100). ${commits} commits in the class. The foundation is LAID.`
      ],
      concern: [
        `${rec.w}-${rec.l} is tough — but Mercer builds through adversity.`,
        `Rollins: "We're learning. Young program, young players. The best is ahead."`,
        `Prestige at ${prestige}. ${commits} commits locked in. Next year, it clicks.`
      ]
    };
    return lines[tone][Math.floor(Math.random()*3)];
  },

  // Ticker text for broadcast bar
  tickerItems(state) {
    const items = [`🔵 UMKC KANGAROOS FOOTBALL ${state.currentYear} — ROO RADIO 816`];
    const rec = v71GetRecord(state.schedule || []);
    items.push(`📊 SEASON RECORD: ${rec.w}-${rec.l}`);

    (state.broadcast?.broadcastLog || []).slice(0, 5).forEach(e => {
      const t = BCAST.TYPES[e.type] || BCAST.TYPES.CUSTOM;
      items.push(`${t.icon} ${e.text.slice(0, 90)}${e.text.length > 90 ? '...' : ''}`);
    });
    items.push(`🏟️ DURWOOD STADIUM — KANSAS CITY, MO — CAPACITY ${(state.stadium?.capacity||10000).toLocaleString()}`);
    const nilSpend = V71_NIL_ENGINE.calcNILSpend(state);
    items.push(`💰 ROO 816 NIL: $${(nilSpend/1000).toFixed(0)}K deployed | ${(state.recruiting.commitments||[]).length} commits`);
    return items;
  },

  // Render full broadcast log UI
  renderLog(state) {
    const log = (state.broadcast?.broadcastLog || []);
    const ticker = this.tickerItems(state);

    return `
<div style="padding:1.5rem;">
  <!-- Ticker Bar -->
  <div class="broadcast-ticker" style="border-radius:var(--radius-md);margin-bottom:1.5rem;padding:.6rem 1rem;">
    <span class="broadcast-ticker__text">${ticker.join(' &nbsp;|&nbsp; ')}</span>
  </div>

  <!-- Header -->
  <div class="roo-card roo-card--gold" style="margin-bottom:1.5rem;">
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
      <div style="font-size:2.5rem;">📻</div>
      <div>
        <h2 class="font-display text-gold" style="font-size:1.8rem;">ROO RADIO 816</h2>
        <p class="text-muted">PBP: ${BCAST.VOICES.pbp} &nbsp;·&nbsp; Color: ${BCAST.VOICES.color} &nbsp;·&nbsp; Sideline: ${BCAST.VOICES.sideline}</p>
        <p style="font-size:.8rem;color:var(--roo-info);">UMKC Kangaroos Football Broadcast Network — ${state.currentYear} Season</p>
      </div>
    </div>
  </div>

  <!-- Season Narrative -->
  <div class="roo-card" style="margin-bottom:1.5rem;border-left:4px solid var(--umkc-gold);">
    <h3 class="font-display text-gold" style="margin-bottom:.75rem;">📝 Season Dispatch</h3>
    <p style="font-style:italic;line-height:1.8;">"${this.seasonNarrative(state)}"</p>
    <p style="font-size:.75rem;color:var(--color-text-muted);margin-top:.5rem;">
      — Marcus Webb, Roo Radio 816
    </p>
  </div>

  <!-- Broadcast Log -->
  <div class="roo-card">
    <h3 class="font-display text-gold" style="margin-bottom:1rem;">📋 Broadcast Log (${log.length} entries)</h3>
    ${log.length === 0
      ? '<p class="text-muted" style="text-align:center;padding:2rem;">No broadcasts yet. Simulate games to generate entries.</p>'
      : `<div style="display:flex;flex-direction:column;gap:.75rem;max-height:600px;overflow-y:auto;padding-right:.5rem;">
          ${log.map(entry => {
            const t = BCAST.TYPES[entry.type] || BCAST.TYPES.CUSTOM;
            return `
            <div style="display:flex;gap:.75rem;padding:.75rem;background:var(--color-surface-1);border-radius:var(--radius-md);border-left:3px solid ${t.color};">
              <div style="font-size:1.5rem;flex-shrink:0;">${t.icon}</div>
              <div style="flex:1;min-width:0;">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.25rem;">
                  <span style="font-size:.7rem;font-weight:600;color:${t.color};text-transform:uppercase;letter-spacing:.06em;">${t.label}</span>
                  <span style="font-size:.7rem;color:var(--color-text-muted);">Wk ${entry.week || 0} · ${entry.year || state.currentYear}</span>
                </div>
                <p style="font-size:.875rem;line-height:1.6;word-break:break-word;">${entry.text}</p>
              </div>
            </div>`;
          }).join('')}
        </div>`}
  </div>
</div>`;
  }
};

/* ── Wire renderBroadcast into global scope ─────────────────────────────── */
function renderBroadcast(state) {
  const el = document.getElementById('main-content');
  if (el) el.innerHTML = V71_BROADCAST_ENGINE.renderLog(state);
}

/* ── Rivalry Engine ──────────────────────────────────────────────────────── */
const V71_RIVALRY_ENGINE = {

  updateResult(state, rivalryId, won) {
    const riv = (state.rivalries || []).find(r => r.id === rivalryId);
    if (!riv) return;
    if (won) riv.seriesRecord.w++;
    else     riv.seriesRecord.l++;
    riv.lastResult = won ? 'W' : 'L';
    riv.heatLevel  = Math.min(100, riv.heatLevel + (won ? 8 : 5));
  },

  getTrophyHolder(rivalry) {
    const {w,l} = rivalry.seriesRecord;
    if (w > l) return 'UMKC';
    if (l > w) return rivalry.opponent;
    return 'Unclaimed';
  },

  heatLabel(level) {
    if (level >= 80) return { label:'LEGENDARY', color:'#F0AB00' };
    if (level >= 60) return { label:'HEATED',    color:'#EF4444' };
    if (level >= 40) return { label:'BUILDING',  color:'#F97316' };
    if (level >= 20) return { label:'EMERGING',  color:'#3B82F6' };
    return               { label:'DORMANT',   color:'#6B7280' };
  },

  // Tradition morale bonus for home games
  homeGameTraditionBonus(state) {
    return (state.traditions || [])
      .filter(t => ['pregame','postgame'].includes(t.category) && t.status !== 'inactive')
      .reduce((sum, t) => sum + (t.moralBonus || 0), 0);
  },

  // Render rivalries panel
  renderPanel(state) {
    const rivalries   = state.rivalries   || [];
    const traditions  = state.traditions  || [];

    return `
<div style="padding:1.5rem;">
  <div class="roo-card roo-card--gold" style="margin-bottom:1.5rem;">
    <h2 class="font-display text-gold" style="font-size:2rem;">🔥 RIVALRIES & TRADITIONS</h2>
    <p class="text-muted">UMKC is building something. Every rivalry has a trophy. Every win writes history.</p>

/* ── State Persistence ───────────────────────────────────────────────────── */
const V71_SAVE_KEY = 'umkc_dynasty_v71';

function v71SaveState(state) {
  state.lastSaved = new Date().toISOString();
  try {
    localStorage.setItem(V71_SAVE_KEY, JSON.stringify(state));
  } catch(e) {
    console.warn('[v7.1] Save failed (storage quota?):', e);
  }
}

function v71LoadState() {
  try {
    const raw = localStorage.getItem(V71_SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) {
    console.warn('[v7.1] Load failed:', e);
    return null;
  }
}

function v71ResetState() {
  if (!confirm('⚠️ Reset ALL dynasty progress? This cannot be undone.')) return;
  localStorage.removeItem(V71_SAVE_KEY);
  window.state = v71InitState();
  window.state.players   = JSON.parse(JSON.stringify(V71_FOUNDING_ROSTER));
  window.state.staff     = JSON.parse(JSON.stringify(V71_STAFF_ROSTER));
  window.state.schedule  = JSON.parse(JSON.stringify(V71_SCHEDULE_2024));
  window.state.nil.deals = JSON.parse(JSON.stringify(V71_NIL_DEALS));
  window.state.nil.donors= JSON.parse(JSON.stringify(V71_DONOR_REGISTRY));
  window.state.stadium   = JSON.parse(JSON.stringify(V71_STADIUM));
  window.state.traditions= JSON.parse(JSON.stringify(V71_TRADITIONS));
  window.state.rivalries = JSON.parse(JSON.stringify(V71_RIVALRIES));
  renderCurrentView(window.state);
  V71_BROADCAST_ENGINE.addEntry(window.state, 'CUSTOM',
    '🔄 New dynasty started. Welcome to UMKC Kangaroos Football — Year One begins.');
  v71SaveState(window.state);
  alert('Dynasty reset. Welcome, Coach Mercer.');
}

function v71SetTab(tabId) {
  currentTab = tabId;
  // Update active state on nav
  document.querySelectorAll('.roo-nav__tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tabId);
  });
  renderCurrentView(window.state);
}

function renderCurrentView(state) {
  const el = document.getElementById('main-content');
  if (!el || !state) return;

  // Phase guard: force to Training Camp if still in camp
  if (state.currentPhase === 'TRAINING_CAMP' && currentTab === 'gameday') {
    currentTab = 'camp';
  }

  switch (currentTab) {
    case 'dashboard':   el.innerHTML = renderDashboard(state);           break;
    case 'camp':        el.innerHTML = renderTrainingCamp(state);        break;
    case 'roster':      el.innerHTML = renderRoster(state);              break;
    case 'schedule':    el.innerHTML = renderSchedule(state);            break;
    case 'gameday':     el.innerHTML = renderGameDayHub(state);          break;
    case 'recruiting':  el.innerHTML = V71_RECRUITING_ENGINE.renderBoard(state); break;
    case 'nil':         el.innerHTML = renderNILPanel(state);            break;
    case 'rivalries':   el.innerHTML = V71_RIVALRY_ENGINE.renderPanel(state);    break;
    case 'staff':       el.innerHTML = renderStaffPanel(state);          break;
    case 'broadcast':   el.innerHTML = V71_BROADCAST_ENGINE.renderLog(state);    break;
    case 'stadium':     el.innerHTML = renderStadiumPanel(state);        break;
    default:            el.innerHTML = renderDashboard(state);

}

  const nextG = v71GetNextGame(state);
  if (nextG) { currentGame = nextG.id; return renderGameDay(state, nextG.id); }
  return `<div style="padding:1.5rem;"><div class="roo-card"><p class="text-muted" style="text-align:center;padding:2rem;">No upcoming games. Season may be complete.</p></div></div>`;
}

/* ── Staff Panel ─────────────────────────────────────────────────────────── */
function renderStaffPanel(state) {
  const staff = state.staff || [];
  const groups = { 'Head Coach':[], 'Offensive Staff':[], 'Defensive Staff':[],
                   'Special Teams':[], 'Support Staff':[] };
  staff.forEach(s => {
    if (s.unit === 'HC')   groups['Head Coach'].push(s);
    else if (['OFF','OL','QB','WR','TE','RB'].includes(s.unit)) groups['Offensive Staff'].push(s);
    else if (['DEF','DL','LB','CB','SAF'].includes(s.unit))     groups['Defensive Staff'].push(s);
    else if (s.unit === 'ST')  groups['Special Teams'].push(s);
    else                        groups['Support Staff'].push(s);
  });

  return `
<div style="padding:1.5rem;">
  <div class="roo-card roo-card--gold" style="margin-bottom:1.5rem;">
    <h2 class="font-display text-gold" style="font-size:2rem;">🎓 COACHING STAFF</h2>
    <p class="text-muted">${staff.length}-person staff · Head Coach: Jake Mercer · ${state.currentYear}</p>
  </div>
  ${Object.entries(groups).filter(([,members])=>members.length).map(([group, members]) => `
  <div class="roo-card" style="margin-bottom:1rem;">
    <h3 class="font-display text-gold" style="margin-bottom:.75rem;">${group} (${members.length})</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.75rem;">
      ${members.map(s => `
      <div style="background:var(--color-surface-1);border-radius:var(--radius-md);padding:.875rem;border:1px solid var(--color-border);">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.4rem;">
          <div>
            <div style="font-weight:700;">${s.name}</div>
            <div style="font-size:.78rem;color:var(--umkc-gold);">${s.title}</div>
          </div>
          <div style="text-align:right;">
            <div class="font-display" style="font-size:1.4rem;color:var(--umkc-gold);">${s.overallRating}</div>
            <div style="font-size:.65rem;color:var(--color-text-muted);">OVR</div>
          </div>
        </div>
        <div style="font-size:.75rem;color:var(--color-text-muted);">
          Age ${s.age} · ${s.yearsExp}yr exp · $${(s.salary/1000).toFixed(0)}K
        </div>
        ${s.traits?.length ? `<div style="margin-top:.4rem;display:flex;flex-wrap:wrap;gap:.3rem;">
          ${s.traits.map(t => `<span class="roo-badge badge-star-3" style="font-size:.65rem;">${t}</span>`).join('')}
        </div>` : ''}
        ${s.bio ? `<p style="font-size:.72rem;color:var(--color-text-muted);margin-top:.4rem;font-style:italic;">${s.bio}</p>` : ''}
      </div>`).join('')}
    </div>
  </div>`).join('')}
</div>`;
}

/* ── NIL Panel ───────────────────────────────────────────────────────────── */
function renderNILPanel(state) {
  const sum    = V71_NIL_ENGINE.collectiveSummary(state);
  const deals  = state.nil?.deals || [];
  const donors = state.nil?.donors || [];

  return `
<div style="padding:1.5rem;">
  ${V71_NIL_ENGINE.renderCollectivePanel(state)}
  <div class="roo-card" style="margin-top:1.5rem;margin-bottom:1rem;">
    <h3 class="font-display text-gold" style="margin-bottom:1rem;">📜 Active NIL Deals (${deals.filter(d=>d.status==='active').length})</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.75rem;">
      ${deals.filter(d=>d.status==='active').map(d => {
        const tierColor = { platinum:'#E5E4E2', gold:'var(--umkc-gold)', silver:'#C0C0C0', bronze:'#CD7F32', none:'var(--color-text-muted)' }[d.tier]||'var(--color-text-muted)';
        return `
        <div style="background:var(--color-surface-1);border-radius:var(--radius-md);padding:1rem;border:1px solid ${tierColor}40;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;">
            <strong>${d.playerName}</strong>
            <span class="roo-badge badge-nil" style="color:${tierColor};">${d.tier.toUpperCase()}</span>
          </div>
          <p style="font-size:.78rem;color:var(--umkc-gold);margin:.2rem 0;">${d.sponsor}</p>
          <p style="font-size:.78rem;color:var(--color-text-muted);margin:.2rem 0;">${d.dealType}</p>
          <div style="display:flex;justify-content:space-between;margin-top:.5rem;font-size:.78rem;">
            <span>$${d.annualValue.toLocaleString()}/yr</span>
            <span style="color:var(--color-text-muted);">Exp: ${d.expiresDate?.slice(0,7)}</span>
          </div>
          ${d.performanceBonus ? `<p style="font-size:.72rem;color:var(--roo-success);margin-top:.3rem;">🎯 Bonus: ${d.performanceBonus.trigger} → +$${d.performanceBonus.bonus.toLocaleString()}</p>` : ''}
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="roo-card">
    <h3 class="font-display text-gold" style="margin-bottom:1rem;">🤝 Donor Registry (${donors.length})</h3>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.83rem;min-width:600px;">
        <thead>
          <tr style="border-bottom:2px solid var(--color-border);">
            ${['Donor','Tier','Annual Gift','Preferred Area','Loyalty'].map(h =>
              `<th style="padding:.5rem .75rem;text-align:left;color:var(--color-text-muted);font-size:.72rem;text-transform:uppercase;">${h}</th>`
            ).join('')}
          </tr>
        </thead>
        <tbody>
          ${donors.sort((a,b)=>b.annualGift-a.annualGift).map(d => {
            const tc = { platinum:'#E5E4E2', gold:'var(--umkc-gold)', silver:'#C0C0C0', bronze:'#CD7F32' }[d.tier]||'white';
            return `<tr style="border-bottom:1px solid var(--color-border);">
              <td style="padding:.5rem .75rem;font-weight:600;">${d.name}${d.isCorporate?' 🏢':''}</td>
              <td style="padding:.5rem .75rem;"><span style="color:${tc};font-weight:600;">${d.tier.toUpperCase()}</span></td>
              <td style="padding:.5rem .75rem;color:var(--roo-success);">$${d.annualGift.toLocaleString()}</td>
              <td style="padding:.5rem .75rem;color:var(--color-text-muted);">${d.preferredArea}</td>
              <td style="padding:.5rem .75rem;">
                <div class="roo-progress" style="width:80px;display:inline-block;">
                  <div class="roo-progress__fill" style="width:${d.loyaltyScore}%;"></div>
                </div>
                <span style="font-size:.75rem;margin-left:.4rem;">${d.loyaltyScore}</span>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>
</div>`;
}

/* ── Stadium Panel ───────────────────────────────────────────────────────── */
function renderStadiumPanel(state) {
  const st = state.stadium || V71_STADIUM;
  const totalCap = (st.sections||[]).reduce((s,sec)=>s+sec.capacity,0);
  const projFill  = (st.sections||[]).reduce((s,sec)=>s+sec.capacity*sec.fillRate,0);

  return `
<div style="padding:1.5rem;">
  <div class="roo-card roo-card--gold" style="margin-bottom:1.5rem;">
    <h2 class="font-display text-gold" style="font-size:2rem;">🏟️ DURWOOD STADIUM</h2>
    <p class="text-muted">Kansas City, MO · ${totalCap.toLocaleString()} capacity · FieldTurf Helix 60</p>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-bottom:1.5rem;">
    ${Object.entries(st.amenities||{}).map(([key, val]) => {
      const label = { lockerRoom:'Locker Room', weightRoom:'Weight Room', turfQuality:'Turf Quality',
                      fanExperience:'Fan Experience', mediaFacilities:'Media', recruitingLounge:'Recruiting Lounge' }[key] || key;
      return `<div class="roo-card" style="padding:1rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;">
          <span style="font-weight:600;">${label}</span>
          <span class="font-display" style="color:var(--umkc-gold);font-size:1.3rem;">${val.rating}/${val.maxRating}⭐</span>
        </div>
        <div class="roo-progress"><div class="roo-progress__fill" style="width:${val.rating/val.maxRating*100}%;"></div></div>
        ${val.upgraded ? '<p style="font-size:.7rem;color:var(--roo-success);margin-top:.3rem;">✅ Upgraded</p>' : ''}
      </div>`;
    }).join('')}
  </div>
  <div class="roo-card">
    <h3 class="font-display text-gold" style="margin-bottom:1rem;">🎭 Section Breakdown</h3>
    <table style="width:100%;border-collapse:collapse;font-size:.85rem;">
      <thead>
        <tr style="border-bottom:2px solid var(--color-border);">
          ${['Section','Capacity','Avg Fill','Projected Fans','Loudness'].map(h=>
            `<th style="padding:.5rem;text-align:left;color:var(--color-text-muted);font-size:.72rem;text-transform:uppercase;">${h}</th>`
          ).join('')}
        </tr>
      </thead>
      <tbody>
        ${(st.sections||[]).map(sec => `
          <tr style="border-bottom:1px solid var(--color-border);">
            <td style="padding:.5rem;font-weight:600;">${sec.name}</td>
            <td style="padding:.5rem;">${sec.capacity.toLocaleString()}</td>
            <td style="padding:.5rem;">${(sec.fillRate*100).toFixed(0)}%</td>
            <td style="padding:.5rem;color:var(--umkc-gold);">${Math.round(sec.capacity*sec.fillRate).toLocaleString()}</td>
            <td style="padding:.5rem;">
              ${sec.loudnessMultiplier > 1.2 ? '🔊🔊🔊' : sec.loudnessMultiplier > 0.9 ? '🔊🔊' : sec.loudnessMultiplier > 0 ? '🔊' : '—'}
            </td>
          </tr>`).join('')}
        <tr style="border-top:2px solid var(--umkc-gold);font-weight:700;">
          <td style="padding:.5rem;">TOTAL</td>
          <td style="padding:.5rem;">${totalCap.toLocaleString()}</td>
          <td style="padding:.5rem;">${(projFill/totalCap*100).toFixed(0)}%</td>
          <td style="padding:.5rem;color:var(--umkc-gold);">${Math.round(projFill).toLocaleString()}</td>
          <td style="padding:.5rem;">HFA: ${GDS.hfa(state).toFixed(1)} pts</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>`;
}

/* ── App Boot ────────────────────────────────────────────────────────────── */
function v71Boot() {
  // Initialize state
  const saved = v71LoadState();
  window.state = v71MergeState(saved);
  // Populate arrays from canon if first run
  if (!window.state.staff?.length)     window.state.staff     = JSON.parse(JSON.stringify(V71_STAFF_ROSTER));
  if (!window.state.players?.length)   window.state.players   = JSON.parse(JSON.stringify(V71_FOUNDING_ROSTER));
  if (!window.state.schedule?.length)  window.state.schedule  = JSON.parse(JSON.stringify(V71_SCHEDULE_2024));
  if (!window.state.nil?.deals?.length)window.state.nil.deals = JSON.parse(JSON.stringify(V71_NIL_DEALS));
  if (!window.state.nil?.donors?.length)window.state.nil.donors=JSON.parse(JSON.stringify(V71_DONOR_REGISTRY));
  if (!window.state.stadium)           window.state.stadium   = JSON.parse(JSON.stringify(V71_STADIUM));
  if (!window.state.traditions?.length)window.state.traditions= JSON.parse(JSON.stringify(V71_TRADITIONS));
  if (!window.state.rivalries?.length) window.state.rivalries = JSON.parse(JSON.stringify(V71_RIVALRIES));
  if (!window.state.recruiting?.currentBoard?.length)
    window.state.recruiting.currentBoard = JSON.parse(JSON.stringify(V71_INITIAL_BOARD));

  // Render header
  document.getElementById('app-header').innerHTML = `
    <div class="roo-header">
      <div class="roo-header__logo">🦘 <span>UMKC</span> DYNASTY</div>
      <div class="roo-header__meta">
        <div class="roo-header__season">${window.state.currentYear} Season</div>
        <div>${window.state.currentPhase === 'TRAINING_CAMP' ? '⛺ Training Camp' : 'Week ' + window.state.currentWeek}</div>
        <div style="margin-top:.5rem;display:flex;gap:.5rem;justify-content:flex-end;">
          <button class="roo-btn roo-btn--sm roo-btn--ghost" onclick="v71SaveState(window.state);alert('✅ Saved!')">💾 Save</button>
          <button class="roo-btn roo-btn--sm" style="background:var(--roo-danger);color:white;border-color:var(--roo-danger);" onclick="v71ResetState()">🔄 Reset</button>
        </div>
      </div>
    </div>`;

  // Render nav
  document.getElementById('app-nav').innerHTML = `
    <nav class="roo-nav">
      ${V71_TABS.map(t => `<div class="roo-nav__tab${t.id===currentTab?' active':''}" data-tab="${t.id}" onclick="v71SetTab('${t.id}')">${t.label}</div>`).join('')}
    </nav>`;

  // Auto-save every 2 minutes
  setInterval(() => v71SaveState(window.state), 120000);

  // First-run broadcast
  if (!saved) {
    V71_BROADCAST_ENGINE.addEntry(window.state, 'MILESTONE',
      `🎙️ Welcome to Roo Radio 816. UMKC Kangaroos Football is LIVE. Coach Jake Mercer and his 22-person staff report to Durwood Stadium for Training Camp ${window.state.currentYear}. The Roos are HERE.`);
    V71_BROADCAST_ENGINE.addEntry(window.state, 'CUSTOM',
      `🦘 Dynasty founded. ${window.state.players?.length} players on the inaugural roster. Roo 816 NIL Collective activated at $${(V71_NIL_ENGINE.getTotalBudget(window.state)/1000).toFixed(0)}K.`);
  }

  // Render initial view
  renderCurrentView(window.state);
  v71SaveState(window.state);
  console.log(`[UMKC Dynasty v${window.state.version}] Boot complete. State loaded. Phase: ${window.state.currentPhase}`);
}

// Call boot when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', v71Boot);
} else {
  v71Boot();
}

</script>
</body>
</html>
